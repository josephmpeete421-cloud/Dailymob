<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Mob</title>
<style>
:root{--bg:#eef0f7;--card:#fff;--ink:#1b1b3a;--soft:#6b6f8a;--acc:#ff4d6d;--line:#dde0ee}
[data-theme="dark"]{--bg:#14141f;--card:#1e1e2d;--ink:#eceefb;--soft:#9094b0;--acc:#ff6b85;--line:#2d2d40}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{margin:0;font-size:26px;letter-spacing:-.5px}
h1 span{color:var(--acc)}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
.hdr-btns{display:flex;gap:6px;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
input,textarea{width:100%;padding:11px;margin:5px 0;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
button{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;background:var(--acc);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--soft);padding:6px 10px}
button.icon{background:transparent;color:var(--ink);padding:6px 10px;font-size:18px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.who{font-weight:700}.time{color:var(--soft);font-size:13px;margin-left:6px}
.acts{display:flex;gap:6px;margin-top:8px}
.liked{color:var(--acc);font-weight:700}
.reactions{display:flex;gap:4px;flex-wrap:wrap;align-items:center;position:relative}
.react-picker{display:flex;gap:2px;position:absolute;bottom:38px;left:0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:5}
.react-picker button{font-size:20px;padding:4px 8px}
.cm{display:flex;gap:8px;margin-top:8px;font-size:14px;align-items:flex-start}
.cm-av{width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--line)}
.cm-bubble{background:var(--bg);border-radius:14px;padding:7px 12px;max-width:100%}
.cm-who{font-weight:700;font-size:13px;display:block}
.cm-row{display:flex;gap:8px;align-items:center;margin-top:10px}
.cm-row input{margin:0;flex:1}
.cm-row button{padding:8px 14px}
.file-btn{display:inline-flex;align-items:center;gap:6px;background:var(--bg);color:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;margin:5px 0}
.who{cursor:pointer}
.profile-view{position:fixed;inset:0;background:var(--bg);z-index:60;overflow-y:auto;padding:16px}
.heart-pop{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:70px;pointer-events:none;animation:heartpop .8s ease-out forwards;z-index:3}
@keyframes heartpop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}30%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-50%) scale(1.4);opacity:0}}
.post-media-wrap{position:relative}
.comments-toggle{color:var(--soft);font-size:13px;margin-top:6px;cursor:pointer}
.chat-convo{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--line);cursor:pointer}
.chat-convo .avatar{width:44px;height:44px}
.chat-preview{color:var(--soft);font-size:13px}
.bubble-row{display:flex;margin:6px 0}
.bubble-row.mine{justify-content:flex-end}
.bubble{max-width:75%;padding:9px 13px;border-radius:16px;font-size:14px}
.bubble-row.mine .bubble{background:var(--acc);color:#fff}
.bubble-row:not(.mine) .bubble{background:var(--card);border:1px solid var(--line)}
.chat-thread-msgs{height:60vh;overflow-y:auto;padding:8px;border-radius:10px}
.wallpaper-row{display:flex;gap:8px;padding:8px 0}
.wallpaper-swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.post-preview{position:relative;margin:8px 0;display:inline-block}
.post-preview img,.post-preview video{max-width:100%;max-height:220px;border-radius:10px;display:block}
.post-preview .remove-x{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer}
.media-menu-wrap{position:relative;display:inline-block}
.media-dropdown{position:absolute;top:110%;left:0;background:var(--card);border-radius:12px;min-width:160px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:25;overflow:hidden}
.media-dropdown button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;color:var(--ink);border-radius:0;padding:12px 14px;font-weight:600;border-bottom:1px solid var(--line)}
.media-dropdown button:last-child{border-bottom:none}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.dash-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.dash-card b{display:block;font-size:26px}
.dash-card span{color:var(--soft);font-size:13px}
.notif-row{display:flex;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.notif-row.unseen{background:rgba(255,77,109,.08)}
.notif-row .avatar{width:40px;height:40px}
.dash-tabs{display:flex;gap:6px;margin:10px 0}
.trend-up{color:#2bb673}.trend-down{color:var(--acc)}
.settings-section{margin-bottom:18px}
.settings-section h3{font-size:14px;color:var(--soft);text-transform:uppercase;letter-spacing:.5px;margin:0 0 8px 4px}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.switch{position:relative;width:46px;height:26px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;inset:0;background:var(--line);border-radius:999px;cursor:pointer;transition:.2s}
.switch .slider:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+.slider{background:var(--acc)}
.switch input:checked+.slider:before{transform:translateX(20px)}
.danger-btn{color:var(--acc);border:1px solid var(--acc)}
.blocked-row{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid var(--line)}
.blocked-row .avatar{width:34px;height:34px}
.locked-note{text-align:center;color:var(--soft);padding:30px 16px}
.back-top{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:9px 18px;font-weight:600;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:30;display:flex;align-items:center;gap:6px}
.reel-wrap{position:relative}
.reel-overlay{position:absolute;right:8px;bottom:10px;display:flex;flex-direction:column;align-items:center;gap:16px}
.reel-overlay button{background:rgba(0,0,0,.45);color:#fff;border-radius:50%;width:44px;height:44px;font-size:20px;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:0}
.reel-overlay span{color:#fff;font-size:11px;margin-top:2px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.reels-view{position:fixed;inset:0;background:#000;z-index:70;overflow-y:scroll;scroll-snap-type:y mandatory}
.reel-page{height:100vh;height:100dvh;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
.reel-page video{width:100%;height:100%;object-fit:contain}
.reel-page .reel-overlay{right:12px;bottom:90px}
.reel-caption{position:absolute;left:14px;right:70px;bottom:30px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.reel-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;padding:14px;z-index:5}
.reel-top button{background:rgba(0,0,0,.4);color:#fff;border-radius:50%;width:36px;height:36px}
.reel-mute{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.4);color:#fff;border-radius:50%;width:36px;height:36px}
.notif-row{display:flex;gap:10px;padding:10px;border-bottom:1px solid var(--line);align-items:center}
.notif-row .time{margin-left:auto}
.week-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.week-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.week-card b{font-size:22px}
.week-up{color:#2e7d32;font-size:12px}
.week-flat{color:var(--soft);font-size:12px}
.msg{color:var(--acc);min-height:20px;font-size:14px}
.hide{display:none}
.profile{display:flex;align-items:center;gap:12px}
.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--line);flex-shrink:0}
.pinfo{flex:1;min-width:0}
.pname{font-weight:700;font-size:17px}
.pbio{color:var(--soft);font-size:14px;margin-top:2px}
.stats{display:flex;gap:16px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.stat{text-align:center}
.stat b{display:block;font-size:17px}
.stat span{color:var(--soft);font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;text-align:center;padding:8px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--soft);font-weight:600}
.tab.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.stories-row{display:flex;gap:10px;overflow-x:auto;padding:4px 0 12px}
.story-item{flex-shrink:0;text-align:center;width:64px}
.story-ring{width:58px;height:58px;border-radius:50%;padding:2px;background:linear-gradient(45deg,var(--acc),#ffb703);display:flex;align-items:center;justify-content:center}
.story-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--bg)}
.story-name{font-size:11px;color:var(--soft);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story-add{width:58px;height:58px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--soft)}
.story-viewer{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
.story-viewer img{width:100%;flex:1;object-fit:contain}
.story-viewer .sv-top{display:flex;align-items:center;gap:8px;padding:12px;color:#fff}
.story-viewer .sv-close{background:transparent;color:#fff;font-size:20px;margin-left:auto}
.story-viewers-list{background:#111;color:#fff;padding:10px;font-size:13px;max-height:120px;overflow-y:auto}
.story-react-row{display:flex;gap:10px;justify-content:center;padding:14px;background:#000}
.story-react-row button{background:transparent;font-size:26px;padding:4px 8px}
.tag{color:var(--acc);font-weight:600;cursor:pointer}
.mention{color:var(--acc);font-weight:600}
.post-img{width:100%;border-radius:10px;margin-top:8px;max-height:400px;object-fit:cover}
.tag-banner{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px}
</style>
</head>
<body>
<main>
<header>
  <h1>Daily <span>Mob</span></h1>
  <div class="hdr-btns">
    <span style="position:relative;display:inline-block">
      <button id="notif" class="icon hide" title="Notifications" onclick="openNotifications()">🔔</button>
      <span id="notifBadge" class="hide" style="position:absolute;top:-2px;right:-2px;background:var(--acc);color:#fff;border-radius:50%;font-size:10px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px">0</span>
    </span>
    <button id="reelsBtn" class="icon hide" title="Reels" onclick="openReels()">🎬</button>
    <button id="dash" class="icon hide" title="Dashboard" onclick="openDashboard()">📊</button>
    <span style="position:relative;display:inline-block">
      <button id="msgs" class="icon hide" title="Messages" onclick="openChatList()">💬</button>
      <span id="msgBadge" class="hide" style="position:absolute;top:-2px;right:-2px;background:var(--acc);color:#fff;border-radius:50%;font-size:10px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px">0</span>
    </span>
    <button id="theme" class="icon" title="Toggle dark mode">&#9789;</button>
    <button id="out" class="ghost hide">Log out</button>
  </div>
</header>

<section id="auth" class="card">
  <input id="email" type="email" placeholder="Email" autocomplete="email">
  <input id="pass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
  <input id="uname" placeholder="Username (only for sign up)">
  <input id="dob" type="date" placeholder="Date of birth (only for sign up)">
  <div class="msg" id="amsg"></div>
  <button id="login">Log in</button>
  <button id="signup" class="ghost">Create account</button>
</section>

<section id="app" class="hide">
  <div class="card" id="profileCard">
    <div class="profile">
      <img id="avatarImg" class="avatar" src="" alt="">
      <div class="pinfo">
        <div class="pname" id="pname"></div>
        <div class="pbio" id="pbio"></div>
      </div>
      <button class="ghost" id="editProfile">Edit</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="statPosts">0</b><span>Posts</span></div>
      <div class="stat"><b id="statFollowers">0</b><span>Followers</span></div>
      <div class="stat"><b id="statFollowing">0</b><span>Following</span></div>
      <div class="stat"><b id="statLikes">0</b><span>Likes</span></div>
      <div class="stat"><b id="statStreak">0</b><span>🔥 Streak</span></div>
    </div>
    <div id="editBox" class="hide">
      <input id="avatarFile" type="file" accept="image/*">
      <input id="unameInput" placeholder="Username">
      <input id="cityInput" placeholder="Your city (for the Nearby feed)">
      <textarea id="bioInput" rows="2" placeholder="Write a short bio"></textarea>
      <button id="saveProfile">Save</button>
      <span class="msg" id="profmsg"></span>
      <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:10px">
        <button id="deleteAccount" class="ghost" style="color:var(--acc)">Delete my account</button>
      </div>
    </div>
  </div>

  <div class="stories-row" id="storiesRow"></div>
  <input id="storyFile" type="file" accept="image/*,video/*" class="hide">
  <div class="card">
    <textarea id="txt" rows="3" placeholder="What's happening? Use #tags and @mentions"></textarea>
    <div class="hide" id="mediaMenuBackdrop" onclick="toggleMediaMenu()" style="position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:20"></div>
    <div class="media-menu-wrap">
      <button type="button" class="icon" id="addMediaBtn" onclick="toggleMediaMenu()" style="border:1px solid var(--line);border-radius:50%;width:40px;height:40px">📎</button>
      <div class="hide media-dropdown" id="mediaMenu">
        <button type="button" onclick="pickMedia('image')">📷 Photo</button>
        <button type="button" onclick="pickMedia('video')">🎥 Video</button>
      </div>
    </div>
    <input id="postFile" type="file" class="hide">
    <div id="postPreview"></div>
    <button id="post">Post</button>
    <span class="msg" id="pmsg"></span>
  </div>
  <div class="tabs">
    <button class="tab active" id="tabAll" onclick="setFeedMode('all')">All</button>
    <button class="tab" id="tabNear" onclick="setFeedMode('nearby')">Nearby</button>
  </div>
  <div id="feed"></div>
  <button id="backTop" class="back-top hide" onclick="scrollToTopAndRefresh()">↑ Back to top</button>
</section>
</main>
<div id="profileView" class="profile-view hide"></div>
<div id="chatListView" class="profile-view hide"></div>
<div id="chatThreadView" class="profile-view hide"></div>
<div id="dashboardView" class="profile-view hide"></div>
<div id="notifView" class="profile-view hide"></div>
<div id="reelsView" class="reels-view hide"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://xzflmzrhujkmvcidoudi.supabase.co";
const SUPABASE_KEY = "sb_publishable_XsgQez3wtKuw4jwRAVoHMw_GJzbpXC5";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let me = null;
let myProfile = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// dark mode
const savedTheme = localStorage.getItem("dm-theme");
if (savedTheme === "dark") document.documentElement.setAttribute("data-theme", "dark");
$("theme").onclick = () => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  if (dark) { document.documentElement.removeAttribute("data-theme"); localStorage.setItem("dm-theme", "light"); }
  else { document.documentElement.setAttribute("data-theme", "dark"); localStorage.setItem("dm-theme", "dark"); }
};

async function ensureProfile(user) {
  const { data } = await db.from("profiles").select("*").eq("id", user.id).maybeSingle();
  if (data) return data;
  const name = (user.user_metadata && user.user_metadata.username) || user.email.split("@")[0];
  const dob = (user.user_metadata && user.user_metadata.dob) || null;
  const { data: created } = await db.from("profiles").insert({ id: user.id, username: name, date_of_birth: dob }).select().single();
  return created;
}

function renderProfile() {
  $("pname").textContent = myProfile.username;
  $("pbio").textContent = myProfile.bio || "No bio yet.";
  $("avatarImg").src = myProfile.avatar_url || "https://api.dicebear.com/7.x/initials/svg?seed=" + encodeURIComponent(myProfile.username);
  $("bioInput").value = myProfile.bio || "";
  $("unameInput").value = myProfile.username || "";
  $("cityInput").value = myProfile.city || "";
}

let myFollowing = new Set();

async function loadFollowing() {
  const { data } = await db.from("follows").select("following_id").eq("follower_id", me.id);
  myFollowing = new Set((data || []).map(r => r.following_id));
}

async function loadStats() {
  const [{ count: postsCount }, { count: followersCount }, { count: followingCount }, { data: myPosts }] = await Promise.all([
    db.from("posts").select("id", { count: "exact", head: true }).eq("user_id", me.id),
    db.from("follows").select("follower_id", { count: "exact", head: true }).eq("following_id", me.id),
    db.from("follows").select("following_id", { count: "exact", head: true }).eq("follower_id", me.id),
    db.from("posts").select("id").eq("user_id", me.id)
  ]);
  let likesCount = 0;
  if (myPosts && myPosts.length) {
    const ids = myPosts.map(p => p.id);
    const { count } = await db.from("likes").select("post_id", { count: "exact", head: true }).in("post_id", ids);
    likesCount = count || 0;
  }
  $("statPosts").textContent = postsCount || 0;
  $("statFollowers").textContent = followersCount || 0;
  $("statFollowing").textContent = followingCount || 0;
  $("statLikes").textContent = likesCount;
}

async function loadStreak() {
  const { data } = await db.from("posts").select("created_at").eq("user_id", me.id);
  if (!data || !data.length) { $("statStreak").textContent = "0"; return; }
  const days = new Set(data.map(p => new Date(p.created_at).toDateString()));
  let streak = 0;
  let d = new Date();
  if (!days.has(d.toDateString())) d.setDate(d.getDate() - 1);
  while (days.has(d.toDateString())) { streak++; d.setDate(d.getDate() - 1); }
  $("statStreak").textContent = streak;
}

async function toggleFollow(id, following) {
  if (following) { await db.from("follows").delete().eq("follower_id", me.id).eq("following_id", id); myFollowing.delete(id); }
  else {
    await db.from("follows").insert({ follower_id: me.id, following_id: id });
    myFollowing.add(id);
    db.from("notifications").insert({ user_id: id, actor_id: me.id, type: "follow" });
  }
  loadFeed();
  loadStats();
}

async function start(user) {
  me = user;
  myProfile = await ensureProfile(user);
  renderProfile();
  $("auth").classList.add("hide");
  $("app").classList.remove("hide");
  $("out").classList.remove("hide");
  $("msgs").classList.remove("hide");
  $("dash").classList.remove("hide");
  $("reelsBtn").classList.remove("hide");
  $("notif").classList.remove("hide");
  loadNotifCount();
  loadUnreadCount();
  clearInterval(unreadPollTimer);
  unreadPollTimer = setInterval(loadUnreadCount, 15000);
  clearInterval(notifPollTimer);
  notifPollTimer = setInterval(loadNotifCount, 15000);
  await loadFollowing();
  loadStats();
  loadStreak();
  loadFeed();
  loadStories();
}

$("editProfile").onclick = () => $("editBox").classList.toggle("hide");

$("deleteAccount").onclick = async () => {
  if (!confirm("This permanently deletes your profile, posts, likes, comments and follows. This cannot be undone. Continue?")) return;
  await db.from("comments").delete().eq("user_id", me.id);
  await db.from("likes").delete().eq("user_id", me.id);
  await db.from("follows").delete().eq("follower_id", me.id);
  await db.from("follows").delete().eq("following_id", me.id);
  await db.from("posts").delete().eq("user_id", me.id);
  await db.from("profiles").delete().eq("id", me.id);
  await db.auth.signOut();
  location.reload();
};

$("saveProfile").onclick = async () => {
  $("profmsg").textContent = "Saving...";
  let avatar_url = myProfile.avatar_url;
  const file = $("avatarFile").files[0];
  if (file) {
    const path = me.id + "/" + Date.now() + "-" + file.name;
    const { error: upErr } = await db.storage.from("avatars").upload(path, file, { upsert: true });
    if (upErr) { $("profmsg").textContent = upErr.message; return; }
    avatar_url = db.storage.from("avatars").getPublicUrl(path).data.publicUrl;
  }
  const bio = $("bioInput").value.trim();
  const username = $("unameInput").value.trim();
  const city = $("cityInput").value.trim();
  if (username.length < 3) { $("profmsg").textContent = "Username needs 3+ characters."; return; }
  const { data, error } = await db.from("profiles").update({ bio, username, avatar_url, city }).eq("id", me.id).select().single();
  if (error) { $("profmsg").textContent = error.message; return; }
  myProfile = data;
  renderProfile();
  $("profmsg").textContent = "Saved.";
  $("editBox").classList.add("hide");
};

$("signup").onclick = async () => {
  const username = $("uname").value.trim();
  if (username.length < 3) { $("amsg").textContent = "Choose a username with 3+ characters."; return; }
  const dob = $("dob").value;
  if (!dob) { $("amsg").textContent = "Enter your date of birth."; return; }
  const age = Math.floor((Date.now() - new Date(dob).getTime()) / 31557600000);
  if (age < 16) { $("amsg").textContent = "You must be at least 16 to join Daily Mob."; return; }
  const { data, error } = await db.auth.signUp({
    email: $("email").value.trim(), password: $("pass").value,
    options: { data: { username, dob }, emailRedirectTo: location.href }
  });
  if (error) { $("amsg").textContent = error.message; return; }
  if (data.session) start(data.user);
  else $("amsg").textContent = "Account created. Confirm your email, then log in.";
};

$("login").onclick = async () => {
  const { data, error } = await db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pass").value });
  if (error) { $("amsg").textContent = error.message; return; }
  start(data.user);
};

$("out").onclick = async () => { await db.auth.signOut(); location.reload(); };

function toggleMediaMenu() {
  $("mediaMenu").classList.toggle("hide");
  $("mediaMenuBackdrop").classList.toggle("hide");
}

function pickMedia(kind) {
  $("postFile").accept = kind === "video" ? "video/*" : "image/*";
  $("mediaMenu").classList.add("hide");
  $("mediaMenuBackdrop").classList.add("hide");
  $("postFile").click();
}

$("postFile").onchange = () => {
  const f = $("postFile").files[0];
  if (!f) { $("postPreview").innerHTML = ""; return; }
  const url = URL.createObjectURL(f);
  const tag = f.type.startsWith("video") ? '<video src="' + url + '" controls></video>' : '<img src="' + url + '">';
  $("postPreview").innerHTML = '<div class="post-preview">' + tag + '<div class="remove-x" onclick="clearPostFile()">\u2715</div></div>';
};

function clearPostFile() {
  $("postFile").value = "";
  $("postPreview").innerHTML = "";
}

$("post").onclick = async () => {
  const content = $("txt").value.trim();
  const file = $("postFile").files[0];
  if (!content && !file) return;
  let image_url = null;
  const isVideo = file && file.type.startsWith("video");
  if (file) {
    const path = me.id + "/" + Date.now() + "-" + file.name;
    const { error: upErr } = await db.storage.from("posts").upload(path, file);
    if (upErr) { $("pmsg").textContent = upErr.message; return; }
    image_url = db.storage.from("posts").getPublicUrl(path).data.publicUrl;
  }
  const { error } = await db.from("posts").insert({ user_id: me.id, content, image_url, is_video: isVideo });
  $("pmsg").textContent = error ? error.message : "";
  if (!error) { $("txt").value = ""; clearPostFile(); loadFeed(); loadStreak(); loadStats(); }
};

let lastFeedData = [];
let feedMode = "all";

function setFeedMode(mode) {
  feedMode = mode;
  $("tabAll").classList.toggle("active", mode === "all");
  $("tabNear").classList.toggle("active", mode === "nearby");
  renderFeed();
}

async function loadFeed() {
  const { data, error } = await db.from("posts")
    .select("id,content,created_at,image_url,is_video,profiles!posts_user_id_fkey(id,username,avatar_url,city),likes(user_id,reaction),comments(id,content,profiles!comments_user_id_fkey(id,username,avatar_url))")
    .order("created_at", { ascending: false }).limit(50);
  if (error) { $("feed").innerHTML = '<div class="card msg">' + esc(error.message) + '</div>'; return; }
  lastFeedData = data;
  renderFeed();
}

function highlightContent(raw) {
  return esc(raw).replace(/(?<!&)#(\w+)/g, '<span class="tag" onclick="filterByTag(\'$1\')">#$1</span>').replace(/@(\w+)/g, '<span class="mention">@$1</span>');
}

let currentTagFilter = null;

function filterByTag(tag) {
  currentTagFilter = tag;
  renderFeed();
}

function clearTagFilter() {
  currentTagFilter = null;
  renderFeed();
}

function renderFeed() {
  let data = lastFeedData;
  let banner = "";
  if (currentTagFilter) {
    const re = new RegExp("#" + currentTagFilter + "\\b", "i");
    data = data.filter(p => re.test(p.content || ""));
    banner = '<div class="tag-banner">Showing #' + esc(currentTagFilter) + ' <button class="ghost" style="margin-left:auto" onclick="clearTagFilter()">Clear</button></div>';
  }
  if (feedMode === "nearby") {
    const myCity = (myProfile.city || "").trim().toLowerCase();
    if (!myCity) { $("feed").innerHTML = '<div class="card">Set your city in Edit to see nearby posts.</div>'; return; }
    data = data.filter(p => p.profiles && (p.profiles.city || "").trim().toLowerCase() === myCity);
    if (!data.length) { $("feed").innerHTML = banner + '<div class="card">No posts from ' + esc(myProfile.city) + ' yet.</div>'; return; }
  } else if (!data.length) {
    $("feed").innerHTML = banner + '<div class="card">No posts yet' + (currentTagFilter ? " with that tag" : "") + '. ' + (currentTagFilter ? "" : "Write the first one.") + '</div>'; return;
  }
  const EMOJIS = ["\uD83D\uDC4D", "\u2764\uFE0F", "\uD83D\uDE02", "\uD83D\uDE2E"];
  $("feed").innerHTML = banner + data.map(p => {
    const av = (p.profiles && p.profiles.avatar_url) || "https://api.dicebear.com/7.x/initials/svg?seed=" + encodeURIComponent(p.profiles && p.profiles.username || "U");
    const mine = p.likes.find(l => l.user_id === me.id);
    const mineType = mine ? (mine.reaction || "\uD83D\uDC4D") : null;
    const total = p.likes.length;
    const pickerBtns = EMOJIS.map(e => '<button onclick="pickReact(' + p.id + ',\'' + e + '\')">' + e + '</button>').join("");
    const reactRow = '<button id="reactbtn' + p.id + '" class="ghost ' + (mine ? "liked" : "") + '" onclick="mainReact(' + p.id + ')" ontouchstart="startHold(' + p.id + ')" ontouchend="endHold()" onmousedown="startHold(' + p.id + ')" onmouseup="endHold()">' +
      (mineType || "\uD83D\uDC4D") + ' ' + total + '</button>' +
      '<div class="react-picker hide" id="picker' + p.id + '">' + pickerBtns + '</div>';
    return '<div class="card">' +
      '<div class="profile" style="margin-bottom:8px">' +
      '<img class="avatar" style="width:34px;height:34px;cursor:pointer" src="' + esc(av) + '" onclick="openProfile(\'' + (p.profiles && p.profiles.id) + '\')">' +
      '<span class="who" onclick="openProfile(\'' + (p.profiles && p.profiles.id) + '\')">' + esc(p.profiles && p.profiles.username) + '</span>' +
      '<span class="time">' + new Date(p.created_at).toLocaleString() + '</span>' +
      (p.profiles && p.profiles.id !== me.id ? '<button class="ghost" style="margin-left:auto" onclick="toggleFollow(\'' + p.profiles.id + '\',' + myFollowing.has(p.profiles.id) + ')">' + (myFollowing.has(p.profiles.id) ? "Following" : "Follow") + '</button>' : '') +
      '</div>' +
      '<div class="post-media-wrap" ondblclick="doubleTapLike(' + p.id + ',this)">' +
      '<div>' + highlightContent(p.content || "") + '</div>' +
      (p.image_url ? (p.is_video
        ? '<div class="reel-wrap"><video class="post-img" style="max-height:480px" src="' + esc(p.image_url) + '" controls></video>' +
          '<div class="reel-overlay">' +
          '<button id="reactbtn' + p.id + '" class="' + (mine ? "liked" : "") + '" onclick="mainReact(' + p.id + ')" ontouchstart="startHold(' + p.id + ')" ontouchend="endHold()" onmousedown="startHold(' + p.id + ')" onmouseup="endHold()">' + (mineType || "\uD83D\uDC4D") + '<span>' + total + '</span></button>' +
          '<button onclick="toggleComments(' + p.id + ')">\uD83D\uDCAC<span>' + p.comments.length + '</span></button>' +
          '<button onclick="sharePost(' + p.id + ')">\u27A4<span>Share</span></button>' +
          '</div><div class="react-picker hide" id="picker' + p.id + '" style="bottom:140px;right:60px">' + pickerBtns + '</div></div>'
        : '<img class="post-img" src="' + esc(p.image_url) + '">') : "") +
      '</div>' +
      (p.profiles && p.profiles.id === me.id ? '<div class="acts"><button class="ghost" onclick="editPost(' + p.id + ')">Edit</button><button class="ghost" onclick="deletePost(' + p.id + ')">Delete</button></div>' : "") +
      (p.is_video ? "" : '<div class="acts reactions">' + reactRow +
      '<button class="ghost" onclick="sharePost(' + p.id + ')">Share</button></div>') +
      (!p.is_video && p.comments.length ? '<div class="comments-toggle" onclick="toggleComments(' + p.id + ')" id="ctoggle' + p.id + '">View ' + p.comments.length + ' comment' + (p.comments.length > 1 ? "s" : "") + '</div>' : "") +
      '<div class="hide" id="clist' + p.id + '">' +
      p.comments.map(c => {
        const cav = (c.profiles && c.profiles.avatar_url) || "https://api.dicebear.com/7.x/initials/svg?seed=" + encodeURIComponent(c.profiles && c.profiles.username || "U");
        return '<div class="cm"><img class="cm-av" style="cursor:pointer" src="' + esc(cav) + '" onclick="openProfile(\'' + (c.profiles && c.profiles.id) + '\')"><div class="cm-bubble"><span class="cm-who who" onclick="openProfile(\'' + (c.profiles && c.profiles.id) + '\')">' + esc(c.profiles && c.profiles.username) + '</span>' + esc(c.content) + '</div></div>';
      }).join("") +
      '</div>' +
      '<div class="cm-row"><img class="cm-av" src="' + esc(myProfile.avatar_url || "https://api.dicebear.com/7.x/initials/svg?seed=" + encodeURIComponent(myProfile.username)) + '"><input id="c' + p.id + '" placeholder="Write a comment"><button class="ghost" onclick="addComment(' + p.id + ')">\u27A4</button></div>' +
      '</div>';
  }).join("");
}

function findPostAnywhere(id) {
  return lastFeedData.find(p => p.id === id) || reelsData.find(p => p.id === id);
}

async function react(id, type) {
  const post = findPostAnywhere(id);
  if (!post) return;
  const mine = post.likes.find(l => l.user_id === me.id);
  const mineType = mine ? (mine.reaction || "\uD83D\uDC4D") : null;
  if (mineType === type) {
    await db.from("likes").delete().eq("post_id", id).eq("user_id", me.id);
    post.likes = post.likes.filter(l => l.user_id !== me.id);
  } else if (mine) {
    await db.from("likes").update({ reaction: type }).eq("post_id", id).eq("user_id", me.id);
    mine.reaction = type;
  } else {
    await db.from("likes").insert({ post_id: id, user_id: me.id, reaction: type });
    post.likes.push({ user_id: me.id, reaction: type });
    const ownerId = post.profiles && post.profiles.id;
    if (ownerId && ownerId !== me.id) {
      db.from("notifications").insert({ user_id: ownerId, actor_id: me.id, type: "like", post_id: id });
    }
  }
  const btn = $("reactbtn" + id);
  if (btn) {
    const nowMine = post.likes.find(l => l.user_id === me.id);
    btn.textContent = ((nowMine ? (nowMine.reaction || "\uD83D\uDC4D") : "\uD83D\uDC4D")) + " " + post.likes.length;
    btn.classList.toggle("liked", !!nowMine);
  }
}

let holdTimer = null, heldLong = false;

function startHold(id) {
  heldLong = false;
  holdTimer = setTimeout(() => { heldLong = true; openPicker(id); }, 400);
}

function endHold() { clearTimeout(holdTimer); }

function openPicker(id) {
  document.querySelectorAll(".react-picker").forEach(el => { if (el.id !== "picker" + id) el.classList.add("hide"); });
  $("picker" + id).classList.remove("hide");
}

function mainReact(id) {
  if (heldLong) { heldLong = false; return; }
  const post = findPostAnywhere(id);
  const mine = post && post.likes.find(l => l.user_id === me.id);
  react(id, mine ? (mine.reaction || "\uD83D\uDC4D") : "\uD83D\uDC4D");
}

function pickReact(id, type) {
  $("picker" + id).classList.add("hide");
  react(id, type);
}

function toggleComments(id) {
  const list = $("clist" + id), toggle = $("ctoggle" + id);
  const show = list.classList.contains("hide");
  list.classList.toggle("hide");
  if (toggle) toggle.textContent = show ? "Hide comments" : toggle.textContent.replace("Hide comments", "View comments");
}

function doubleTapLike(id, el) {
  react(id, "\u2764\uFE0F");
  const heart = document.createElement("div");
  heart.className = "heart-pop";
  heart.textContent = "\u2764\uFE0F";
  el.appendChild(heart);
  setTimeout(() => heart.remove(), 800);
}

async function editPost(id) {
  const post = lastFeedData.find(p => p.id === id);
  if (!post) return;
  const next = prompt("Edit your post:", post.content || "");
  if (next === null) return;
  await db.from("posts").update({ content: next }).eq("id", id);
  loadFeed();
}

async function deletePost(id) {
  if (!confirm("Delete this post? This cannot be undone.")) return;
  await db.from("posts").delete().eq("id", id);
  loadFeed();
  loadStats();
  loadStreak();
}

async function openProfile(userId) {
  if (!userId) return;
  const { data: prof } = await db.from("profiles").select("*").eq("id", userId).maybeSingle();
  if (!prof) return;
  const { data: posts } = await db.from("posts").select("id,content,created_at,image_url,is_video").eq("user_id", userId).order("created_at", { ascending: false });
  const [{ count: followersCount }, { count: followingCount }] = await Promise.all([
    db.from("follows").select("follower_id", { count: "exact", head: true }).eq("following_id", userId),
    db.from("follows").select("following_id", { count: "exact", head: true }).eq("follower_id", userId)
  ]);
  const av = prof.avatar_url || "https://api.dicebear.com/7.x/initials/svg?seed=" + encodeURIComponent(prof.username);
  const isMe = userId === me.id;
  const postsHtml = (posts || []).map(p =>
    '<div class="card">' +
    '<div class="time">' + new Date(p.created_at).toLocaleString() + '</div>' +
    '<div>' + highlightContent(p.content || "") + '</div>' +
    (p.image_url ? (p.is_video ? '<video class="post-img" src="' + esc(p.image_url) + '" controls></video>' : '<img class="post-img" src="' + esc(p.image_url) + '">') : "") +
    (isMe ? '<div class="acts"><button class="ghost" onclick="editPost(' + p.id + ');openProfile(\'' + userId + '\')">Edit</button><button class="ghost" onclick="deletePost(' + p.id + ');closeProfileView()">Delete</button></div>' : "") +
    '</div>'
  ).join("") || '<div class="card">No posts yet.</div>';
  $("profileView").innerHTML =
    '<button class="ghost" onclick="closeProfileView()">\u2190 Back</button>' +
    '<div class="card"><div class="profile">' +
    '<img class="avatar" src="' + esc(av) + '">' +
    '<div class="pinfo"><div class="pname">' + esc(prof.username) + '</div><div class="pbio">' + esc(prof.bio || "No bio yet.") + '</div></div>' +
    (!isMe ? '<button class="ghost" onclick="toggleFollow(\'' + userId + '\',' + myFollowing.has(userId) + ');openProfile(\'' + userId + '\')">' + (myFollowing.has(userId) ? "Following" : "Follow") + '</button>' : "") +
    (!isMe ? '<button class="ghost" onclick="openChatThread(\'' + userId + '\',\'' + esc(prof.username) + '\')">Message</button>' : "") +
    '</div><div class="stats"><div class="stat"><b>' + (posts ? posts.length : 0) + '</b><span>Posts</span></div><div class="stat"><b>' + (followersCount || 0) + '</b><span>Followers</span></div><div class="stat"><b>' + (followingCount || 0) + '</b><span>Following</span></div></div></div>' +
    postsHtml;
  $("profileView").classList.remove("hide");
}

function closeProfileView() {
  $("profileView").classList.add("hide");
}

async function openChatList() {
  const { data } = await db.from("messages")
    .select("id,content,created_at,sender_id,receiver_id,sender:profiles!messages_sender_id_fkey(id,username,avatar_url),receiver:profiles!messages_receiver_id_fkey(id,username,avatar_url)")
    .or("sender_id.eq." + me.id + ",receiver_id.eq." + me.id)
    .order("created_at", { ascending: false });
  const convos = {};
  (data || []).forEach(m => {
    const other = m.sender_id === me.id ? m.receiver : m.sender;
    if (!other) return;
    if (!convos[other.id]) convos[other.id] = { user: other, last: m };
  });
  const list = Object.values(convos);
  const html = list.length ? list.map(c => {
    const av = (c.user.avatar_url) || "https://api.dicebear.com/7.x/initials/svg?seed=" + encodeURIComponent(c.user.username);
    return '<div class="chat-convo" onclick="openChatThread(\'' + c.user.id + '\',\'' + esc(c.user.username) + '\')">' +
      '<img class="avatar" src="' + esc(av) + '">' +
      '<div><div class="who">' + esc(c.user.username) + '</div><div class="chat-preview">' + esc(c.last.content) + '</div></div>' +
      '</div>';
  }).join("") : '<div class="card">No messages yet. Open someone\u2019s profile and tap Message.</div>';
  $("chatListView").innerHTML = '<button class="ghost" onclick="closeChatList()">\u2190 Back</button><h1 style="margin:10px 0">Messages</h1>' + html;
  $("chatListView").classList.remove("hide");
}

function closeChatList() { $("chatListView").classList.add("hide"); }

let chatPollTimer = null;
let unreadPollTimer = null;
let notifPollTimer = null;
let currentChatUser = null;

async function loadUnreadCount() {
  const { count } = await db.from("messages").select("id", { count: "exact", head: true }).eq("receiver_id", me.id).eq("seen", false);
  const badge = $("msgBadge");
  if (!badge) return;
  if (count && count > 0) { badge.textContent = count > 9 ? "9+" : count; badge.classList.remove("hide"); }
  else badge.classList.add("hide");
}

function markThreadSeen(otherId) {
  db.from("messages").update({ seen: true }).eq("sender_id", otherId).eq("receiver_id", me.id).eq("seen", false).then(() => loadUnreadCount());
}

async function openChatThread(otherId, otherName) {
  currentChatUser = otherId;
  closeChatList();
  closeProfileView();
  await renderChatThread(otherId, otherName);
  markThreadSeen(otherId);
  $("chatThreadView").classList.remove("hide");
  clearInterval(chatPollTimer);
  chatPollTimer = setInterval(() => { renderChatThread(otherId, otherName, true); markThreadSeen(otherId); }, 5000);
}

async function renderChatThread(otherId, otherName, silent) {
  const { data } = await db.from("messages")
    .select("id,content,created_at,sender_id,seen")
    .or("and(sender_id.eq." + me.id + ",receiver_id.eq." + otherId + "),and(sender_id.eq." + otherId + ",receiver_id.eq." + me.id + ")")
    .order("created_at", { ascending: true });
  const list = data || [];
  let lastMineIdx = -1;
  list.forEach((m, i) => { if (m.sender_id === me.id) lastMineIdx = i; });
  const msgsHtml = list.map((m, i) =>
    '<div class="bubble-row ' + (m.sender_id === me.id ? "mine" : "") + '"><div class="bubble">' + esc(m.content) +
    (i === lastMineIdx && m.seen ? '<div style="font-size:11px;opacity:.7;margin-top:2px">Seen</div>' : "") +
    '</div></div>'
  ).join("") || '<div class="card">Say hello!</div>';
  if (silent) {
    const box = $("chatThreadMsgs");
    if (box) { box.innerHTML = msgsHtml; box.scrollTop = box.scrollHeight; }
    return;
  }
  const WALLPAPERS = [
    "default",
    "linear-gradient(135deg,#d9fdd3,#aee9c9)",
    "linear-gradient(135deg,#ffe3ec,#ffc2d4)",
    "linear-gradient(135deg,#e0ecff,#c7d8ff)",
    "linear-gradient(135deg,#fff2d8,#ffdca0)",
    "linear-gradient(135deg,#eadcfb,#d3b8f0)",
    "linear-gradient(135deg,#1c1c2b,#0d0d16)"
  ];
  $("chatThreadView").innerHTML =
    '<button class="ghost" onclick="closeChatThread()">\u2190 Back</button>' +
    '<h1 style="margin:10px 0">' + esc(otherName) + ' <button class="ghost" onclick="toggleWallpaperPicker()" style="font-size:16px">\uD83C\uDFA8</button></h1>' +
    '<div class="wallpaper-row hide" id="wallpaperRow">' + WALLPAPERS.map(c => c === "default"
      ? '<div class="wallpaper-swatch" style="background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px" onclick="setChatWallpaper(\'' + otherId + '\',\'default\')">\u21BB</div>'
      : '<div class="wallpaper-swatch" style="background:' + c + '" onclick="setChatWallpaper(\'' + otherId + '\',\'' + c + '\')"></div>'
    ).join("") + '</div>' +
    '<div class="chat-thread-msgs" id="chatThreadMsgs">' + msgsHtml + '</div>' +
    '<div class="cm-row"><input id="chatInput" placeholder="Type a message"><button class="ghost" onclick="sendChatMessage(\'' + otherId + '\',\'' + esc(otherName) + '\')">\u27A4</button></div>';
  const box = $("chatThreadMsgs");
  const savedBg = localStorage.getItem("chatbg-" + otherId);
  if (box && savedBg) box.style.background = savedBg;
  if (box) box.scrollTop = box.scrollHeight;
}

async function sendChatMessage(otherId, otherName) {
  const input = $("chatInput");
  const content = input.value.trim();
  if (!content) return;
  input.value = "";
  await db.from("messages").insert({ sender_id: me.id, receiver_id: otherId, content });
  renderChatThread(otherId, otherName, true);
}

function toggleWallpaperPicker() {
  const row = $("wallpaperRow");
  if (row) row.classList.toggle("hide");
}

function setChatWallpaper(otherId, color) {
  const box = $("chatThreadMsgs");
  if (color === "default") {
    localStorage.removeItem("chatbg-" + otherId);
    if (box) box.style.background = "";
  } else {
    localStorage.setItem("chatbg-" + otherId, color);
    if (box) box.style.background = color;
  }
  toggleWallpaperPicker();
}

async function loadNotifCount() {
  const { count } = await db.from("notifications").select("id", { count: "exact", head: true }).eq("user_id", me.id).eq("seen", false);
  const badge = $("notifBadge");
  if (!badge) return;
  if (count && count > 0) { badge.textContent = count > 9 ? "9+" : count; badge.classList.remove("hide"); }
  else badge.classList.add("hide");
}

async function openNotifications() {
  const { data } = await db.from("notifications")
    .select("id,type,created_at,seen,actor:profiles!notifications_actor_id_fkey(username,avatar_url)")
    .eq("user_id", me.id).order("created_at", { ascending: false }).limit(50);
  const verbs = { like: "reacted to your post", comment: "commented on your post", follow: "started following you" };
  const html = (data && data.length) ? data.map(n => {
    const av = (n.actor && n.actor.avatar_url) || "https://api.dicebear.com/7.x/initials/svg?seed=" + encodeURIComponent(n.actor && n.actor.username || "U");
    return '<div class="notif-row ' + (n.seen ? "" : "unseen") + '">' +
      '<img class="avatar" src="' + esc(av) + '">' +
      '<div><b>' + esc(n.actor && n.actor.username) + '</b> ' + (verbs[n.type] || "did something") + '<div class="time">' + new Date(n.created_at).toLocaleString() + '</div></div>' +
      '</div>';
  }).join("") : '<div class="card">No notifications yet.</div>';
  $("notifView").innerHTML =
    '<button class="ghost" onclick="closeNotifications()">\u2190 Back</button>' +
    '<h1 style="margin:10px 0">Notifications</h1>' + html;
  $("notifView").classList.remove("hide");
  await db.from("notifications").update({ seen: true }).eq("user_id", me.id).eq("seen", false);
  loadNotifCount();
}

function closeNotifications() { $("notifView").classList.add("hide"); }

async function openDashboard() {
  const [{ count: postsCount }, { count: followersCount }, { count: followingCount }, { data: myPosts }, { count: storiesCount }] = await Promise.all([
    db.from("posts").select("id", { count: "exact", head: true }).eq("user_id", me.id),
    db.from("follows").select("follower_id", { count: "exact", head: true }).eq("following_id", me.id),
    db.from("follows").select("following_id", { count: "exact", head: true }).eq("follower_id", me.id),
    db.from("posts").select("id").eq("user_id", me.id),
    db.from("stories").select("id", { count: "exact", head: true }).eq("user_id", me.id)
  ]);
  let likesCount = 0, commentsCount = 0;
  if (myPosts && myPosts.length) {
    const ids = myPosts.map(p => p.id);
    const [{ count: lc }, { count: cc }] = await Promise.all([
      db.from("likes").select("post_id", { count: "exact", head: true }).in("post_id", ids),
      db.from("comments").select("post_id", { count: "exact", head: true }).in("post_id", ids)
    ]);
    likesCount = lc || 0; commentsCount = cc || 0;
  }
  const streakText = $("statStreak") ? $("statStreak").textContent : "0";
  const cards = [
    [postsCount || 0, "Posts"], [followersCount || 0, "Followers"], [followingCount || 0, "Following"],
    [likesCount, "Reactions received"], [commentsCount, "Comments received"], [storiesCount || 0, "Stories posted"],
    [streakText, "\uD83D\uDD25 Day streak"]
  ];
  $("dashboardView").innerHTML =
    '<button class="ghost" onclick="closeDashboard()">\u2190 Back</button>' +
    '<h1 style="margin:10px 0">Your Dashboard</h1>' +
    '<div class="dash-tabs"><button class="tab active" id="dtHome" onclick="setDashTab(\'home\')">Home</button><button class="tab" id="dtAnalytics" onclick="setDashTab(\'analytics\')">Analytics</button></div>' +
    '<div id="dashHome"><div class="dash-grid">' + cards.map(c => '<div class="dash-card"><b>' + c[0] + '</b><span>' + c[1] + '</span></div>').join("") + '</div></div>' +
    '<div id="dashAnalytics" class="hide"><div class="card">Loading...</div></div>';
  $("dashboardView").classList.remove("hide");
}

function setDashTab(tab) {
  $("dtHome").classList.toggle("active", tab === "home");
  $("dtAnalytics").classList.toggle("active", tab === "analytics");
  $("dashHome").classList.toggle("hide", tab !== "home");
  $("dashAnalytics").classList.toggle("hide", tab !== "analytics");
  if (tab === "analytics") loadWeeklyAnalytics();
}

function trendLabel(curr, prev) {
  if (!prev) return curr > 0 ? '<span class="trend-up">New</span>' : "--";
  const pct = Math.round(((curr - prev) / prev) * 100);
  return '<span class="' + (pct >= 0 ? "trend-up" : "trend-down") + '">' + (pct >= 0 ? "+" : "") + pct + '%</span>';
}

async function loadWeeklyAnalytics() {
  const weekAgo = new Date(Date.now() - 7 * 86400000).toISOString();
  const twoWeeksAgo = new Date(Date.now() - 14 * 86400000).toISOString();
  const { data: myPosts } = await db.from("posts").select("id").eq("user_id", me.id);
  const ids = (myPosts || []).map(p => p.id);
  const [postsThisQ, postsPrevQ, folThisQ, folPrevQ] = await Promise.all([
    db.from("posts").select("id", { count: "exact", head: true }).eq("user_id", me.id).gte("created_at", weekAgo),
    db.from("posts").select("id", { count: "exact", head: true }).eq("user_id", me.id).gte("created_at", twoWeeksAgo).lt("created_at", weekAgo),
    db.from("follows").select("follower_id", { count: "exact", head: true }).eq("following_id", me.id).gte("created_at", weekAgo),
    db.from("follows").select("follower_id", { count: "exact", head: true }).eq("following_id", me.id).gte("created_at", twoWeeksAgo).lt("created_at", weekAgo)
  ]);
  let reactT = 0, reactP = 0, commT = 0, commP = 0;
  if (ids.length) {
    const [rT, rP, cT, cP] = await Promise.all([
      db.from("likes").select("post_id", { count: "exact", head: true }).in("post_id", ids).gte("created_at", weekAgo),
      db.from("likes").select("post_id", { count: "exact", head: true }).in("post_id", ids).gte("created_at", twoWeeksAgo).lt("created_at", weekAgo),
      db.from("comments").select("post_id", { count: "exact", head: true }).in("post_id", ids).gte("created_at", weekAgo),
      db.from("comments").select("post_id", { count: "exact", head: true }).in("post_id", ids).gte("created_at", twoWeeksAgo).lt("created_at", weekAgo)
    ]);
    reactT = rT.count || 0; reactP = rP.count || 0; commT = cT.count || 0; commP = cP.count || 0;
  }
  const rows = [
    ["New posts", postsThisQ.count || 0, postsPrevQ.count || 0],
    ["New followers", folThisQ.count || 0, folPrevQ.count || 0],
    ["Reactions received", reactT, reactP],
    ["Comments received", commT, commP]
  ];
  $("dashAnalytics").innerHTML = '<p class="msg" style="color:var(--soft)">This week vs the previous 7 days</p>' +
    rows.map(r => '<div class="dash-card" style="margin-bottom:10px"><b>' + r[1] + '</b> ' + trendLabel(r[1], r[2]) + '<span>' + r[0] + '</span></div>').join("");
}

function closeDashboard() { $("dashboardView").classList.add("hide"); }

let reelsObserver = null;
let reelsData = [];

async function openReels() {
  const { data } = await db.from("posts")
    .select("id,content,image_url,profiles!posts_user_id_fkey(id,username,avatar_url),likes(user_id,reaction),comments(id)")
    .eq("is_video", true).order("created_at", { ascending: false }).limit(30);
  const list = data || [];
  if (!list.length) {
    $("reelsView").innerHTML = '<div class="reel-top"><button onclick="closeReels()">\u2715</button></div><div class="locked-note" style="color:#fff;padding-top:40vh">No videos yet.</div>';
    $("reelsView").classList.remove("hide");
    return;
  }
  const EMOJIS = ["\uD83D\uDC4D", "\u2764\uFE0F", "\uD83D\uDE02", "\uD83D\uDE2E"];
  $("reelsView").innerHTML = '<div class="reel-top"><button onclick="closeReels()">\u2715</button></div>' +
    list.map((p, i) => {
      const mine = p.likes.find(l => l.user_id === me.id);
      const mineType = mine ? (mine.reaction || "\uD83D\uDC4D") : null;
      const av = (p.profiles && p.profiles.avatar_url) || "https://api.dicebear.com/7.x/initials/svg?seed=" + encodeURIComponent(p.profiles && p.profiles.username || "U");
      const pickerBtns = EMOJIS.map(e => '<button onclick="pickReact(' + p.id + ',\'' + e + '\')">' + e + '</button>').join("");
      return '<div class="reel-page">' +
        '<video src="' + esc(p.image_url) + '" loop playsinline muted data-id="' + p.id + '"></video>' +
        '<button class="reel-mute" onclick="toggleReelMute(this)">\uD83D\uDD07</button>' +
        '<div class="reel-caption"><div class="who" onclick="openProfile(\'' + (p.profiles && p.profiles.id) + '\')"><img class="avatar" style="width:28px;height:28px;vertical-align:middle;margin-right:6px" src="' + esc(av) + '">' + esc(p.profiles && p.profiles.username) + '</div><div>' + highlightContent(p.content || "") + '</div></div>' +
        '<div class="reel-overlay">' +
        '<button id="reactbtn' + p.id + '" class="' + (mine ? "liked" : "") + '" onclick="mainReact(' + p.id + ')" ontouchstart="startHold(' + p.id + ')" ontouchend="endHold()" onmousedown="startHold(' + p.id + ')" onmouseup="endHold()">' + (mineType || "\uD83D\uDC4D") + '<span>' + p.likes.length + '</span></button>' +
        '<button onclick="sharePost(' + p.id + ')">\u27A4<span>Share</span></button>' +
        '</div><div class="react-picker hide" id="picker' + p.id + '" style="bottom:160px;right:60px">' + pickerBtns + '</div>' +
        '</div>';
    }).join("");
  $("reelsView").classList.remove("hide");
  reelsData = list;
  setupReelsAutoplay();
}

function toggleReelMute(btn) {
  const video = btn.parentElement.querySelector("video");
  video.muted = !video.muted;
  btn.textContent = video.muted ? "\uD83D\uDD07" : "\uD83D\uDD0A";
}

function setupReelsAutoplay() {
  if (reelsObserver) reelsObserver.disconnect();
  const videos = document.querySelectorAll("#reelsView video");
  reelsObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) entry.target.play().catch(() => {});
      else entry.target.pause();
    });
  }, { threshold: 0.6 });
  videos.forEach(v => reelsObserver.observe(v));
  if (videos[0]) videos[0].play().catch(() => {});
}

function closeReels() {
  if (reelsObserver) reelsObserver.disconnect();
  document.querySelectorAll("#reelsView video").forEach(v => v.pause());
  $("reelsView").classList.add("hide");
  $("reelsView").innerHTML = "";
}

function closeChatThread() {
  clearInterval(chatPollTimer);
  currentChatUser = null;
  $("chatThreadView").classList.add("hide");
}

async function addComment(id) {
  const box = $("c" + id), content = box.value.trim();
  if (!content) return;
  await db.from("comments").insert({ post_id: id, user_id: me.id, content });
  const post = lastFeedData.find(p => p.id === id);
  const ownerId = post && post.profiles && post.profiles.id;
  if (ownerId && ownerId !== me.id) {
    db.from("notifications").insert({ user_id: ownerId, actor_id: me.id, type: "comment", post_id: id });
  }
  loadFeed();
}

let storyGroups = [];
let currentStoryGroup = null;
let currentStoryIndex = 0;

async function loadStories() {
  const cutoff = new Date(Date.now() - 24 * 3600 * 1000).toISOString();
  const { data } = await db.from("stories")
    .select("id,image_url,created_at,user_id,is_video,profiles!stories_user_id_fkey(id,username,avatar_url)")
    .gt("created_at", cutoff).order("created_at", { ascending: true });
  const groups = {};
  (data || []).forEach(s => {
    const uid = s.user_id;
    if (!groups[uid]) groups[uid] = { user: s.profiles, stories: [] };
    groups[uid].stories.push(s);
  });
  storyGroups = Object.values(groups);
  renderStoriesRow();
}

function renderStoriesRow() {
  const addHtml = '<div class="story-item"><div class="story-add" onclick="document.getElementById(\'storyFile\').click()">+</div><div class="story-name">Your story</div></div>';
  const others = storyGroups.map(g => {
    const av = (g.user && g.user.avatar_url) || "https://api.dicebear.com/7.x/initials/svg?seed=" + encodeURIComponent(g.user ? g.user.username : "U");
    return '<div class="story-item" onclick="openStory(\'' + g.user.id + '\')"><div class="story-ring"><img src="' + esc(av) + '"></div><div class="story-name">' + esc(g.user.username) + '</div></div>';
  }).join("");
  $("storiesRow").innerHTML = addHtml + others;
}

$("storyFile").onchange = async () => {
  const file = $("storyFile").files[0];
  if (!file) return;
  const path = me.id + "/" + Date.now() + "-" + file.name;
  const { error: upErr } = await db.storage.from("stories").upload(path, file);
  if (upErr) { alert(upErr.message); return; }
  const url = db.storage.from("stories").getPublicUrl(path).data.publicUrl;
  await db.from("stories").insert({ user_id: me.id, image_url: url, is_video: file.type.startsWith("video") });
  $("storyFile").value = "";
  loadStories();
};

function openStory(userId) {
  const group = storyGroups.find(g => g.user && g.user.id === userId);
  if (!group) return;
  currentStoryGroup = group;
  currentStoryIndex = 0;
  showStoryFrame();
}

function showStoryFrame() {
  const g = currentStoryGroup;
  const s = g.stories[currentStoryIndex];
  if (!s) { closeStoryViewer(); return; }
  if (g.user.id !== me.id) {
    db.from("story_views").insert({ story_id: s.id, viewer_id: me.id }).then(() => {});
  }
  const overlay = document.createElement("div");
  overlay.className = "story-viewer";
  overlay.id = "storyOverlay";
  overlay.innerHTML =
    '<div class="sv-top"><b>' + esc(g.user.username) + '</b><span style="opacity:.7;font-size:12px">' + new Date(s.created_at).toLocaleString() + '</span>' +
    (g.user.id === me.id ? '<button class="sv-close" onclick="deleteStory(' + s.id + ')" style="margin-left:auto;font-size:14px">Delete</button>' : "") +
    '<button class="sv-close" onclick="closeStoryViewer()">\u2715</button></div>' +
    (s.is_video ? '<video src="' + esc(s.image_url) + '" controls autoplay onclick="nextStoryFrame()"></video>' : '<img src="' + esc(s.image_url) + '" onclick="nextStoryFrame()">') +
    (g.user.id !== me.id ? '<div class="story-react-row">' + ["\uD83D\uDC4D", "\u2764\uFE0F", "\uD83D\uDE02", "\uD83D\uDE2E"].map(e => '<button onclick="reactStory(' + s.id + ',\'' + e + '\')">' + e + '</button>').join("") + '</div>' : "") +
    (g.user.id === me.id ? '<div class="story-viewers-list" id="storyViewersList">Loading views...</div>' : "");
  document.body.appendChild(overlay);
  if (g.user.id === me.id) {
    db.from("story_views").select("reaction,profiles!story_views_viewer_id_fkey(username)").eq("story_id", s.id).then(({ data }) => {
      const names = (data || []).map(v => (v.profiles && v.profiles.username || "") + (v.reaction ? " " + v.reaction : ""));
      const el = $("storyViewersList");
      if (el) el.textContent = names.length ? ("Seen by: " + names.join(", ")) : "No views yet.";
    });
  }
}

async function reactStory(storyId, emoji) {
  await db.from("story_views").upsert({ story_id: storyId, viewer_id: me.id, reaction: emoji }, { onConflict: "story_id,viewer_id" });
  const row = document.querySelector(".story-react-row");
  if (row) row.innerHTML = '<span style="color:#fff;font-size:20px">' + emoji + ' sent</span>';
}

async function deleteStory(storyId) {
  if (!confirm("Delete this story?")) return;
  await db.from("stories").delete().eq("id", storyId);
  closeStoryViewer();
  loadStories();
}

function nextStoryFrame() {
  currentStoryIndex++;
  closeStoryViewer(true);
  if (currentStoryGroup && currentStoryIndex < currentStoryGroup.stories.length) showStoryFrame();
}

function closeStoryViewer(skipGroupReset) {
  const el = $("storyOverlay");
  if (el) el.remove();
  if (!skipGroupReset) currentStoryGroup = null;
}

function sharePost(id) {
  const link = location.href.split("#")[0] + "#post-" + id;
  if (navigator.share) navigator.share({ title: "Daily Mob", url: link });
  else { navigator.clipboard.writeText(link); alert("Link copied."); }
}

window.addEventListener("scroll", () => {
  const btn = $("backTop");
  if (!btn) return;
  if (window.scrollY > 400) btn.classList.remove("hide");
  else btn.classList.add("hide");
});

function scrollToTopAndRefresh() {
  window.scrollTo({ top: 0, behavior: "smooth" });
  loadFeed();
  $("backTop").classList.add("hide");
}

db.auth.getSession().then(({ data }) => { if (data.session) start(data.session.user); });
</script>
