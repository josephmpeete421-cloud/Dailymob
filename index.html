<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Mob</title>
<style>
:root{--bg:#eef0f7;--card:#fff;--ink:#1b1b3a;--soft:#6b6f8a;--acc:#ff4d6d;--line:#dde0ee}
[data-theme="dark"]{--bg:#14141f;--card:#1e1e2d;--ink:#eceefb;--soft:#9094b0;--acc:#ff6b85;--line:#2d2d40}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{margin:0;font-size:26px;letter-spacing:-.5px}
h1 span{color:var(--acc)}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
.hdr-btns{display:flex;gap:6px;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
input,textarea{width:100%;padding:11px;margin:5px 0;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
button{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;background:var(--acc);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--soft);padding:6px 10px}
button.icon{background:transparent;color:var(--ink);padding:6px 10px;font-size:18px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.who{font-weight:700}.time{color:var(--soft);font-size:13px;margin-left:6px}
.acts{display:flex;gap:6px;margin-top:8px}
.liked{color:var(--acc);font-weight:700}
.reactions{display:flex;gap:4px;flex-wrap:wrap;align-items:center;position:relative}
.react-picker{display:flex;gap:2px;position:absolute;bottom:38px;left:0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:5}
.react-picker button{font-size:20px;padding:4px 8px}
.cm{border-top:1px solid var(--line);margin-top:8px;padding-top:6px;font-size:15px}
.msg{color:var(--acc);min-height:20px;font-size:14px}
.hide{display:none}
.profile{display:flex;align-items:center;gap:12px}
.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--line);flex-shrink:0}
.pinfo{flex:1;min-width:0}
.pname{font-weight:700;font-size:17px}
.pbio{color:var(--soft);font-size:14px;margin-top:2px}
.stats{display:flex;gap:16px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.stat{text-align:center}
.stat b{display:block;font-size:17px}
.stat span{color:var(--soft);font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;text-align:center;padding:8px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--soft);font-weight:600}
.tab.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.stories-row{display:flex;gap:10px;overflow-x:auto;padding:4px 0 12px}
.story-item{flex-shrink:0;text-align:center;width:64px}
.story-ring{width:58px;height:58px;border-radius:50%;padding:2px;background:linear-gradient(45deg,var(--acc),#ffb703);display:flex;align-items:center;justify-content:center}
.story-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--bg)}
.story-name{font-size:11px;color:var(--soft);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story-add{width:58px;height:58px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--soft)}
.story-viewer{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
.story-viewer img{width:100%;flex:1;object-fit:contain}
.story-viewer .sv-top{display:flex;align-items:center;gap:8px;padding:12px;color:#fff}
.story-viewer .sv-close{background:transparent;color:#fff;font-size:20px;margin-left:auto}
.story-viewers-list{background:#111;color:#fff;padding:10px;font-size:13px;max-height:120px;overflow-y:auto}
</style>
</head>
<body>
<main>
<header>
  <h1>Daily <span>Mob</span></h1>
  <div class="hdr-btns">
    <button id="theme" class="icon" title="Toggle dark mode">&#9789;</button>
    <button id="out" class="ghost hide">Log out</button>
  </div>
</header>

<section id="auth" class="card">
  <input id="email" type="email" placeholder="Email" autocomplete="email">
  <input id="pass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
  <input id="uname" placeholder="Username (only for sign up)">
  <input id="dob" type="date" placeholder="Date of birth (only for sign up)">
  <div class="msg" id="amsg"></div>
  <button id="login">Log in</button>
  <button id="signup" class="ghost">Create account</button>
</section>

<section id="app" class="hide">
  <div class="card" id="profileCard">
    <div class="profile">
      <img id="avatarImg" class="avatar" src="" alt="">
      <div class="pinfo">
        <div class="pname" id="pname"></div>
        <div class="pbio" id="pbio"></div>
      </div>
      <button class="ghost" id="editProfile">Edit</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="statPosts">0</b><span>Posts</span></div>
      <div class="stat"><b id="statFollowers">0</b><span>Followers</span></div>
      <div class="stat"><b id="statFollowing">0</b><span>Following</span></div>
      <div class="stat"><b id="statLikes">0</b><span>Likes</span></div>
      <div class="stat"><b id="statStreak">0</b><span>🔥 Streak</span></div>
    </div>
    <div id="editBox" class="hide">
      <input id="avatarFile" type="file" accept="image/*">
      <input id="unameInput" placeholder="Username">
      <input id="cityInput" placeholder="Your city (for the Nearby feed)">
      <textarea id="bioInput" rows="2" placeholder="Write a short bio"></textarea>
      <button id="saveProfile">Save</button>
      <span class="msg" id="profmsg"></span>
      <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:10px">
        <button id="deleteAccount" class="ghost" style="color:var(--acc)">Delete my account</button>
      </div>
    </div>
  </div>

  <div class="stories-row" id="storiesRow"></div>
  <input id="storyFile" type="file" accept="image/*" class="hide">
  <div class="card">
    <textarea id="txt" rows="3" placeholder="What's happening?"></textarea>
    <button id="post">Post</button>
    <span class="msg" id="pmsg"></span>
  </div>
  <div class="tabs">
    <button class="tab active" id="tabAll" onclick="setFeedMode('all')">All</button>
    <button class="tab" id="tabNear" onclick="setFeedMode('nearby')">Nearby</button>
  </div>
  <div id="feed"></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://xzflmzrhujkmvcidoudi.supabase.co";
const SUPABASE_KEY = "sb_publishable_XsgQez3wtKuw4jwRAVoHMw_GJzbpXC5";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let me = null;
let myProfile = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// dark mode
const savedTheme = localStorage.getItem("dm-theme");
if (savedTheme === "dark") document.documentElement.setAttribute("data-theme", "dark");
$("theme").onclick = () => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  if (dark) { document.documentElement.removeAttribute("data-theme"); localStorage.setItem("dm-theme", "light"); }
  else { document.documentElement.setAttribute("data-theme", "dark"); localStorage.setItem("dm-theme", "dark"); }
};

async function ensureProfile(user) {
  const { data } = await db.from("profiles").select("*").eq("id", user.id).maybeSingle();
  if (data) return data;
  const name = (user.user_metadata && user.user_metadata.username) || user.email.split("@")[0];
  const dob = (user.user_metadata && user.user_metadata.dob) || null;
  const { data: created } = await db.from("profiles").insert({ id: user.id, username: name, date_of_birth: dob }).select().single();
  return created;
}

function renderProfile() {
  $("pname").textContent = myProfile.username;
  $("pbio").textContent = myProfile.bio || "No bio yet.";
  $("avatarImg").src = myProfile.avatar_url || "https://api.dicebear.com/7.x/initials/svg?seed=" + encodeURIComponent(myProfile.username);
  $("bioInput").value = myProfile.bio || "";
  $("unameInput").value = myProfile.username || "";
  $("cityInput").value = myProfile.city || "";
}

let myFollowing = new Set();

async function loadFollowing() {
  const { data } = await db.from("follows").select("following_id").eq("follower_id", me.id);
  myFollowing = new Set((data || []).map(r => r.following_id));
}

async function loadStats() {
  const [{ count: postsCount }, { count: followersCount }, { count: followingCount }, { data: myPosts }] = await Promise.all([
    db.from("posts").select("id", { count: "exact", head: true }).eq("user_id", me.id),
    db.from("follows").select("follower_id", { count: "exact", head: true }).eq("following_id", me.id),
    db.from("follows").select("following_id", { count: "exact", head: true }).eq("follower_id", me.id),
    db.from("posts").select("id").eq("user_id", me.id)
  ]);
  let likesCount = 0;
  if (myPosts && myPosts.length) {
    const ids = myPosts.map(p => p.id);
    const { count } = await db.from("likes").select("post_id", { count: "exact", head: true }).in("post_id", ids);
    likesCount = count || 0;
  }
  $("statPosts").textContent = postsCount || 0;
  $("statFollowers").textContent = followersCount || 0;
  $("statFollowing").textContent = followingCount || 0;
  $("statLikes").textContent = likesCount;
}

async function loadStreak() {
  const { data } = await db.from("posts").select("created_at").eq("user_id", me.id);
  if (!data || !data.length) { $("statStreak").textContent = "0"; return; }
  const days = new Set(data.map(p => new Date(p.created_at).toDateString()));
  let streak = 0;
  let d = new Date();
  if (!days.has(d.toDateString())) d.setDate(d.getDate() - 1);
  while (days.has(d.toDateString())) { streak++; d.setDate(d.getDate() - 1); }
  $("statStreak").textContent = streak;
}

async function toggleFollow(id, following) {
  if (following) { await db.from("follows").delete().eq("follower_id", me.id).eq("following_id", id); myFollowing.delete(id); }
  else { await db.from("follows").insert({ follower_id: me.id, following_id: id }); myFollowing.add(id); }
  loadFeed();
  loadStats();
}

async function start(user) {
  me = user;
  myProfile = await ensureProfile(user);
  renderProfile();
  $("auth").classList.add("hide");
  $("app").classList.remove("hide");
  $("out").classList.remove("hide");
  await loadFollowing();
  loadStats();
  loadStreak();
  loadFeed();
  loadStories();
}

$("editProfile").onclick = () => $("editBox").classList.toggle("hide");

$("deleteAccount").onclick = async () => {
  if (!confirm("This permanently deletes your profile, posts, likes, comments and follows. This cannot be undone. Continue?")) return;
  await db.from("comments").delete().eq("user_id", me.id);
  await db.from("likes").delete().eq("user_id", me.id);
  await db.from("follows").delete().eq("follower_id", me.id);
  await db.from("follows").delete().eq("following_id", me.id);
  await db.from("posts").delete().eq("user_id", me.id);
  await db.from("profiles").delete().eq("id", me.id);
  await db.auth.signOut();
  location.reload();
};

$("saveProfile").onclick = async () => {
  $("profmsg").textContent = "Saving...";
  let avatar_url = myProfile.avatar_url;
  const file = $("avatarFile").files[0];
  if (file) {
    const path = me.id + "/" + Date.now() + "-" + file.name;
    const { error: upErr } = await db.storage.from("avatars").upload(path, file, { upsert: true });
    if (upErr) { $("profmsg").textContent = upErr.message; return; }
    avatar_url = db.storage.from("avatars").getPublicUrl(path).data.publicUrl;
  }
  const bio = $("bioInput").value.trim();
  const username = $("unameInput").value.trim();
  const city = $("cityInput").value.trim();
  if (username.length < 3) { $("profmsg").textContent = "Username needs 3+ characters."; return; }
  const { data, error } = await db.from("profiles").update({ bio, username, avatar_url, city }).eq("id", me.id).select().single();
  if (error) { $("profmsg").textContent = error.message; return; }
  myProfile = data;
  renderProfile();
  $("profmsg").textContent = "Saved.";
  $("editBox").classList.add("hide");
};

$("signup").onclick = async () => {
  const username = $("uname").value.trim();
  if (username.length < 3) { $("amsg").textContent = "Choose a username with 3+ characters."; return; }
  const dob = $("dob").value;
  if (!dob) { $("amsg").textContent = "Enter your date of birth."; return; }
  const age = Math.floor((Date.now() - new Date(dob).getTime()) / 31557600000);
  if (age < 16) { $("amsg").textContent = "You must be at least 16 to join Daily Mob."; return; }
  const { data, error } = await db.auth.signUp({
    email: $("email").value.trim(), password: $("pass").value,
    options: { data: { username, dob }, emailRedirectTo: location.href }
  });
  if (error) { $("amsg").textContent = error.message; return; }
  if (data.session) start(data.user);
  else $("amsg").textContent = "Account created. Confirm your email, then log in.";
};

$("login").onclick = async () => {
  const { data, error } = await db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pass").value });
  if (error) { $("amsg").textContent = error.message; return; }
  start(data.user);
};

$("out").onclick = async () => { await db.auth.signOut(); location.reload(); };

$("post").onclick = async () => {
  const content = $("txt").value.trim();
  if (!content) return;
  const { error } = await db.from("posts").insert({ user_id: me.id, content });
  $("pmsg").textContent = error ? error.message : "";
  if (!error) { $("txt").value = ""; loadFeed(); loadStreak(); loadStats(); }
};

let lastFeedData = [];
let feedMode = "all";

function setFeedMode(mode) {
  feedMode = mode;
  $("tabAll").classList.toggle("active", mode === "all");
  $("tabNear").classList.toggle("active", mode === "nearby");
  renderFeed();
}

async function loadFeed() {
  const { data, error } = await db.from("posts")
    .select("id,content,created_at,profiles!posts_user_id_fkey(id,username,avatar_url,city),likes(user_id,reaction),comments(id,content,profiles!comments_user_id_fkey(username))")
    .order("created_at", { ascending: false }).limit(50);
  if (error) { $("feed").innerHTML = '<div class="card msg">' + esc(error.message) + '</div>'; return; }
  lastFeedData = data;
  renderFeed();
}

function renderFeed() {
  let data = lastFeedData;
  if (feedMode === "nearby") {
    const myCity = (myProfile.city || "").trim().toLowerCase();
    if (!myCity) { $("feed").innerHTML = '<div class="card">Set your city in Edit to see nearby posts.</div>'; return; }
    data = data.filter(p => p.profiles && (p.profiles.city || "").trim().toLowerCase() === myCity);
    if (!data.length) { $("feed").innerHTML = '<div class="card">No posts from ' + esc(myProfile.city) + ' yet.</div>'; return; }
  } else if (!data.length) {
    $("feed").innerHTML = '<div class="card">No posts yet. Write the first one.</div>'; return;
  }
  const EMOJIS = ["\uD83D\uDC4D", "\u2764\uFE0F", "\uD83D\uDE02", "\uD83D\uDE2E"];
  $("feed").innerHTML = data.map(p => {
    const av = (p.profiles && p.profiles.avatar_url) || "https://api.dicebear.com/7.x/initials/svg?seed=" + encodeURIComponent(p.profiles && p.profiles.username || "U");
    const mine = p.likes.find(l => l.user_id === me.id);
    const mineType = mine ? (mine.reaction || "\uD83D\uDC4D") : null;
    const total = p.likes.length;
    const pickerBtns = EMOJIS.map(e => '<button onclick="pickReact(' + p.id + ',\'' + e + '\')">' + e + '</button>').join("");
    const reactRow = '<button class="ghost ' + (mine ? "liked" : "") + '" onclick="mainReact(' + p.id + ')" ontouchstart="startHold(' + p.id + ')" ontouchend="endHold()" onmousedown="startHold(' + p.id + ')" onmouseup="endHold()">' +
      (mineType || "\uD83D\uDC4D") + ' ' + total + '</button>' +
      '<div class="react-picker hide" id="picker' + p.id + '">' + pickerBtns + '</div>';
    return '<div class="card">' +
      '<div class="profile" style="margin-bottom:8px">' +
      '<img class="avatar" style="width:34px;height:34px" src="' + esc(av) + '">' +
      '<span class="who">' + esc(p.profiles && p.profiles.username) + '</span>' +
      '<span class="time">' + new Date(p.created_at).toLocaleString() + '</span>' +
      (p.profiles && p.profiles.id !== me.id ? '<button class="ghost" style="margin-left:auto" onclick="toggleFollow(\'' + p.profiles.id + '\',' + myFollowing.has(p.profiles.id) + ')">' + (myFollowing.has(p.profiles.id) ? "Following" : "Follow") + '</button>' : '') +
      '</div>' +
      '<div>' + esc(p.content) + '</div>' +
      '<div class="acts reactions">' + reactRow +
      '<button class="ghost" onclick="sharePost(' + p.id + ')">Share</button></div>' +
      p.comments.map(c => '<div class="cm"><span class="who">' + esc(c.profiles && c.profiles.username) + '</span> ' + esc(c.content) + '</div>').join("") +
      '<input id="c' + p.id + '" placeholder="Write a comment"><button class="ghost" onclick="addComment(' + p.id + ')">Comment</button>' +
      '</div>';
  }).join("");
}

async function react(id, type) {
  const post = lastFeedData.find(p => p.id === id);
  const mine = post && post.likes.find(l => l.user_id === me.id);
  const mineType = mine ? (mine.reaction || "\uD83D\uDC4D") : null;
  if (mineType === type) {
    await db.from("likes").delete().eq("post_id", id).eq("user_id", me.id);
  } else if (mine) {
    await db.from("likes").update({ reaction: type }).eq("post_id", id).eq("user_id", me.id);
  } else {
    await db.from("likes").insert({ post_id: id, user_id: me.id, reaction: type });
  }
  loadFeed();
}

let holdTimer = null, heldLong = false;

function startHold(id) {
  heldLong = false;
  holdTimer = setTimeout(() => { heldLong = true; openPicker(id); }, 400);
}

function endHold() { clearTimeout(holdTimer); }

function openPicker(id) {
  document.querySelectorAll(".react-picker").forEach(el => { if (el.id !== "picker" + id) el.classList.add("hide"); });
  $("picker" + id).classList.remove("hide");
}

function mainReact(id) {
  if (heldLong) { heldLong = false; return; }
  const post = lastFeedData.find(p => p.id === id);
  const mine = post && post.likes.find(l => l.user_id === me.id);
  react(id, mine ? (mine.reaction || "\uD83D\uDC4D") : "\uD83D\uDC4D");
}

function pickReact(id, type) {
  $("picker" + id).classList.add("hide");
  react(id, type);
}

async function addComment(id) {
  const box = $("c" + id), content = box.value.trim();
  if (!content) return;
  await db.from("comments").insert({ post_id: id, user_id: me.id, content });
  loadFeed();
}

let storyGroups = [];
let currentStoryGroup = null;
let currentStoryIndex = 0;

async function loadStories() {
  const cutoff = new Date(Date.now() - 24 * 3600 * 1000).toISOString();
  const { data } = await db.from("stories")
    .select("id,image_url,created_at,user_id,profiles!stories_user_id_fkey(id,username,avatar_url)")
    .gt("created_at", cutoff).order("created_at", { ascending: true });
  const groups = {};
  (data || []).forEach(s => {
    const uid = s.user_id;
    if (!groups[uid]) groups[uid] = { user: s.profiles, stories: [] };
    groups[uid].stories.push(s);
  });
  storyGroups = Object.values(groups);
  renderStoriesRow();
}

function renderStoriesRow() {
  const addHtml = '<div class="story-item"><div class="story-add" onclick="document.getElementById(\'storyFile\').click()">+</div><div class="story-name">Your story</div></div>';
  const others = storyGroups.map(g => {
    const av = (g.user && g.user.avatar_url) || "https://api.dicebear.com/7.x/initials/svg?seed=" + encodeURIComponent(g.user ? g.user.username : "U");
    return '<div class="story-item" onclick="openStory(\'' + g.user.id + '\')"><div class="story-ring"><img src="' + esc(av) + '"></div><div class="story-name">' + esc(g.user.username) + '</div></div>';
  }).join("");
  $("storiesRow").innerHTML = addHtml + others;
}

$("storyFile").onchange = async () => {
  const file = $("storyFile").files[0];
  if (!file) return;
  const path = me.id + "/" + Date.now() + "-" + file.name;
  const { error: upErr } = await db.storage.from("stories").upload(path, file);
  if (upErr) { alert(upErr.message); return; }
  const url = db.storage.from("stories").getPublicUrl(path).data.publicUrl;
  await db.from("stories").insert({ user_id: me.id, image_url: url });
  $("storyFile").value = "";
  loadStories();
};

function openStory(userId) {
  const group = storyGroups.find(g => g.user && g.user.id === userId);
  if (!group) return;
  currentStoryGroup = group;
  currentStoryIndex = 0;
  showStoryFrame();
}

function showStoryFrame() {
  const g = currentStoryGroup;
  const s = g.stories[currentStoryIndex];
  if (!s) { closeStoryViewer(); return; }
  if (g.user.id !== me.id) {
    db.from("story_views").insert({ story_id: s.id, viewer_id: me.id }).then(() => {});
  }
  const overlay = document.createElement("div");
  overlay.className = "story-viewer";
  overlay.id = "storyOverlay";
  overlay.innerHTML =
    '<div class="sv-top"><b>' + esc(g.user.username) + '</b><span style="opacity:.7;font-size:12px">' + new Date(s.created_at).toLocaleString() + '</span><button class="sv-close" onclick="closeStoryViewer()">\u2715</button></div>' +
    '<img src="' + esc(s.image_url) + '" onclick="nextStoryFrame()">' +
    (g.user.id === me.id ? '<div class="story-viewers-list" id="storyViewersList">Loading views...</div>' : "");
  document.body.appendChild(overlay);
  if (g.user.id === me.id) {
    db.from("story_views").select("profiles!story_views_viewer_id_fkey(username)").eq("story_id", s.id).then(({ data }) => {
      const names = (data || []).map(v => v.profiles && v.profiles.username).filter(Boolean);
      const el = $("storyViewersList");
      if (el) el.textContent = names.length ? ("Seen by: " + names.join(", ")) : "No views yet.";
    });
  }
}

function nextStoryFrame() {
  currentStoryIndex++;
  closeStoryViewer(true);
  if (currentStoryGroup && currentStoryIndex < currentStoryGroup.stories.length) showStoryFrame();
}

function closeStoryViewer(skipGroupReset) {
  const el = $("storyOverlay");
  if (el) el.remove();
  if (!skipGroupReset) currentStoryGroup = null;
}

function sharePost(id) {
  const link = location.href.split("#")[0] + "#post-" + id;
  if (navigator.share) navigator.share({ title: "Daily Mob", url: link });
  else { navigator.clipboard.writeText(link); alert("Link copied."); }
}

db.auth.getSession().then(({ data }) => { if (data.session) start(data.session.user); });
</script>
</body>
</html>
