<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Calabar Life</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block}
#top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.panel{background:#101b24dd;color:white;padding:10px 13px;border:1px solid #ffffff44;border-radius:12px;font-size:13px}
#mission{position:absolute;top:76px;left:12px;max-width:245px;background:#101b24dd;color:white;padding:12px;border-radius:12px;font-size:13px;line-height:1.5}
#controls{position:absolute;bottom:20px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end}
.pad{display:grid;grid-template-columns:repeat(3,55px);grid-template-rows:repeat(2,55px);gap:5px}
button{border:1px solid #ffffff77;background:#142b3cdd;color:white;border-radius:14px;font-size:23px;font-weight:bold;touch-action:none}
.pad button{width:55px;height:55px}
#up{grid-column:2;grid-row:1}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#actions{display:flex;flex-direction:column;gap:9px}
#actions button{width:72px;height:58px;font-size:13px}
#notice{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);color:white;background:#10202ddd;padding:15px 20px;border-radius:12px;text-align:center;display:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#142b3c;color:white;text-align:center;padding:25px}
#loading small{display:block;margin-top:10px;color:#d4e3ee}
@media(min-width:800px){.pad{transform:scale(1.15);transform-origin:bottom left}}
</style>
</head>
<body>
<div id="game"></div>

<div id="top">
  <div class="panel"><strong>🌍 CALABAR LIFE</strong><br>OPEN WORLD</div>
  <div class="panel">💵 ₦<span id="money">500</span></div>
</div>

<div id="mission">
  <strong>📍 FIRST MISSION</strong><br>
  Explore the city and find the golden marker.<br>
  <span id="missionText">Distance: calculating...</span>
</div>

<div id="controls">
  <div class="pad">
    <button id="up" aria-label="Move forward">▲</button>
    <button id="left" aria-label="Turn left">◀</button>
    <button id="down" aria-label="Move backward">▼</button>
    <button id="right" aria-label="Turn right">▶</button>
  </div>
  <div id="actions">
    <button id="run">RUN</button>
    <button id="action">ACTION</button>
  </div>
</div>

<div id="notice"></div>
<div id="loading">CALABAR LIFE<small>Building your 3D world…</small></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';

const root = document.getElementById('game');
const loading = document.getElementById('loading');
const notice = document.getElementById('notice');
const missionText = document.getElementById('missionText');

let scene,camera,renderer,player,marker;
let money=500,completed=false,running=false;
let heading=0;
const keys={forward:false,back:false,left:false,right:false};
const clock=new THREE.Clock();

try{
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x91c9f4);
  scene.fog=new THREE.Fog(0x91c9f4,65,190);

  camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,400);

  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  root.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xdff1ff,0x626044,2.1));
  const sun=new THREE.DirectionalLight(0xffedcc,2.5);
  sun.position.set(-35,60,25);
  sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024);
  scene.add(sun);

  function material(color,roughness=1){
    return new THREE.MeshStandardMaterial({color,roughness});
  }
  function box(w,h,d,color,x,y,z){
    const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));
    mesh.position.set(x,y+h/2,z);
    mesh.castShadow=true;
    mesh.receiveShadow=true;
    scene.add(mesh);
    return mesh;
  }

  // Ground and city streets
  box(260,0.2,260,0x658b48,0,-.2,0);
  for(let z=-120;z<=120;z+=60){
    box(12,.12,260,0x343a40,0,-.03,z);
    box(.18,.03,260,0xf4d66b,0,.04,z);
    for(let x=-120;x<=120;x+=10){
      box(.25,.035,3,0xffffff,0,.05,z+x);
    }
  }
  for(let x=-120;x<=120;x+=60){
    box(260,.12,12,0x343a40,x,-.03,0);
    box(260,.03,.18,0xf4d66b,x,.04,0);
  }

  // Buildings with colourful facades and windows
  const buildingColors=[0xe0b48b,0xd9dce0,0xc7d4a1,0xe6a17f,0xb8c9d9,0xe6d6a7,0xd6b9d9];
  for(let x=-105;x<=105;x+=15){
    for(let z=-105;z<=105;z+=15){
      if(Math.abs(x%60)<8||Math.abs(z%60)<8)continue;
      if(Math.abs(x)<19&&Math.abs(z)<19)continue;
      const w=7+Math.random()*4;
      const d=7+Math.random()*4;
      const h=5+Math.random()*17;
      box(w,h,d,buildingColors[Math.floor(Math.random()*buildingColors.length)],x,0,z);

      for(let yy=2.3;yy<h-1;yy+=2.5){
        for(let xx=-w/2+1.3;xx<w/2-.5;xx+=2){
          const win=box(.85,1.1,.08,0x79c7e8,x+xx,yy,z+d/2+.05);
          win.castShadow=false;
        }
      }
    }
  }

  // Tropical trees
  function tree(x,z){
    box(.65,3,.65,0x765036,x,0,z);
    const leaves=new THREE.Mesh(
      new THREE.SphereGeometry(2.2,8,7),
      material(0x237747)
    );
    leaves.position.set(x,4.5,z);
    leaves.castShadow=true;
    scene.add(leaves);
  }
  for(let i=-110;i<=110;i+=15){
    tree(i,8);
    tree(i,-8);
    tree(8,i);
    tree(-8,i);
  }

  // Player character
  player=new THREE.Group();
  const skin=material(0x8b5738);
  const shirt=material(0x1768b2);
  const trousers=material(0x242c39);
  const shoes=material(0x191919);

  function part(w,h,d,mat,x,y,z){
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
    m.position.set(x,y,z);
    m.castShadow=true;
    player.add(m);
    return m;
  }
  part(.9,1.15,.45,shirt,0,1.65,0);
  part(.65,.65,.65,skin,0,2.55,0);
  part(.67,.18,.68,material(0x151515),0,2.91,0);
  part(.27,.95,.3,trousers,-.25,.6,0);
  part(.27,.95,.3,trousers,.25,.6,0);
  part(.3,.16,.45,shoes,-.25,.1,.06);
  part(.3,.16,.45,shoes,.25,.1,.06);
  part(.24,.95,.25,skin,-.59,1.7,0);
  part(.24,.95,.25,skin,.59,1.7,0);
  player.position.set(0,0,0);
  scene.add(player);

  // A simple parked car
  const car=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(2.5,.85,4.3),material(0xc83232,.5));
  body.position.y=.8;
  body.castShadow=true;
  car.add(body);
  const roof=new THREE.Mesh(new THREE.BoxGeometry(1.8,.75,2),material(0x9ac9dc,.4));
  roof.position.set(0,1.5,-.25);
  car.add(roof);
  for(const x of [-1.2,1.2]){
    for(const z of [-1.35,1.35]){
      const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.22,12),material(0x202020));
      wheel.rotation.z=Math.PI/2;
      wheel.position.set(x,.4,z);
      car.add(wheel);
    }
  }
  car.position.set(5,0,-15);
  scene.add(car);

  // Mission marker
  marker=new THREE.Group();
  const ring=new THREE.Mesh(new THREE.TorusGeometry(2,.18,8,24),material(0xffd43b,.5));
  ring.rotation.x=Math.PI/2;
  ring.position.y=.25;
  marker.add(ring);
  const beam=new THREE.Mesh(new THREE.CylinderGeometry(.08,.5,4,12,1,true),new THREE.MeshBasicMaterial({color:0xffd43b,transparent:true,opacity:.45}));
  beam.position.y=2.2;
  marker.add(beam);
  marker.position.set(24,0,-24);
  scene.add(marker);

  // Virtual control buttons
  function bind(id,key){
    const el=document.getElementById(id);
    const down=e=>{e.preventDefault();keys[key]=true;};
    const up=e=>{e.preventDefault();keys[key]=false;};
    el.addEventListener('pointerdown',down);
    el.addEventListener('pointerup',up);
    el.addEventListener('pointercancel',up);
    el.addEventListener('pointerleave',up);
    window.addEventListener('blur',()=>keys[key]=false);
  }
  bind('up','forward');
  bind('down','back');
  bind('left','left');
  bind('right','right');

  document.getElementById('run').addEventListener('pointerdown',e=>{
    e.preventDefault();running=true;
  });
  ['pointerup','pointercancel','pointerleave'].forEach(type=>
    document.getElementById('run').addEventListener(type,()=>running=false)
  );

  document.getElementById('action').addEventListener('click',()=>{
    const distance=player.position.distanceTo(marker.position);
    if(distance<5&&!completed){
      completed=true;
      money+=1000;
      document.getElementById('money').textContent=money;
      missionText.textContent='Mission completed! You earned ₦1,000.';
      marker.visible=false;
      showNotice('MISSION COMPLETE!<br>Reward: ₦1,000');
    }else if(player.position.distanceTo(car.position)<5){
      showNotice('Vehicle interaction will be added in a future update.');
    }else{
      showNotice('Explore the city and find the golden marker.');
    }
  });

  function showNotice(text){
    notice.innerHTML=text;
    notice.style.display='block';
    setTimeout(()=>notice.style.display='none',2200);
  }

  function animate(){
    requestAnimationFrame(animate);
    const dt=Math.min(clock.getDelta(),.04);
    if(keys.left)heading+=2.3*dt;
    if(keys.right)heading-=2.3*dt;
    player.rotation.y=heading;

    let move=0;
    if(keys.forward)move=1;
    if(keys.back)move=-1;
    if(move){
      const speed=(running?11:6)*dt*move;
      player.position.x-=Math.sin(heading)*speed;
      player.position.z-=Math.cos(heading)*speed;
    }
    player.position.x=THREE.MathUtils.clamp(player.position.x,-124,124);
    player.position.z=THREE.MathUtils.clamp(player.position.z,-124,124);

    if(marker.visible){
      marker.rotation.y+=dt*.6;
      marker.position.y=.15+Math.sin(clock.elapsedTime*2)*.15;
      const dist=Math.round(player.position.distanceTo(marker.position));
      missionText.textContent='Find the golden marker • '+dist+' m away';
    }

    // Third-person follow camera
    const offset=new THREE.Vector3(
      Math.sin(heading)*10,
      6.5,
      Math.cos(heading)*10
    );
    const target=player.position.clone().add(offset);
    camera.position.lerp(target,.09);
    camera.lookAt(player.position.x,player.position.y+1.4,player.position.z);

    renderer.render(scene,camera);
  }

  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
    renderer.setSize(innerWidth,innerHeight);
  });

  loading.style.display='none';
  animate();

}catch(error){
  loading.innerHTML='Could not start the 3D game.<small>Check your internet connection and reopen the page.<br>'+String(error.message||error)+'</small>';
}
</script>
</body>
</html>
